
  # =============================================================================
# reTerminal Sticky — ESPHome Hardware Example
# reTerminal Sticky — ESPHome 硬件示例
# =============================================================================
#
# MCU: ESP32-S3R8 (8 MB octal PSRAM, 32 MB flash)
# 主控：ESP32-S3R8（8 MB 八核 PSRAM，32 MB 闪存）
#
# Hardware list / 硬件清单:
#   1. 3.97" B/W ePaper 800x480 (SSD1677, SPI)    / 3.97 英寸黑白墨水屏
#   2. 3x buttons (UP=GPIO5, DOWN=GPIO6, OK=GPIO4) / 3 个按键
#   3. Buzzer (GPIO48, PWM)                        / 蜂鸣器
#   4. Battery: BQ27220 fuel gauge + BQ25616 charger / 电池：电量计 + 充电管理
#   5. SHT40 temp & humidity (I2C @0x44)            / SHT40 温湿度
#   6. PCF8563 RTC (I2C @0x51)                      / PCF8563 实时时钟
#   7. PDM Microphone (CLK=19, DATA=20, EN=38)     / PDM 麦克风
#   8. MicroSD (SPI, EN=10, DET=11, CS=8)          / MicroSD 卡槽
#   9. LSM6DS3TR-C IMU (I2C @0x6A)                 / 六轴 IMU
#  10. GT911 touch (I2C @0x5D, INT=21, RST=41)     / 电容触摸
#  11. Deep sleep with GPIO4 ext1 wake-up          / 深度睡眠 + 按键唤醒
#
# Critical: GPIO45 (PWR_HOLD) + GPIO46 (PWR_LOCK) must be HIGH at boot,
# otherwise the device powers off. Handled by the required "power_hold" option.
# 关键：启动必须拉高 GPIO45/GPIO46，否则断电。由必选项 power_hold 处理。
#
# Serial debug: UART0 via CH343P USB-to-UART bridge.
# 串口调试：通过 CH343P 桥接芯片走 UART0。
# =============================================================================

substitutions:
  device_name: seeed-sticky-1
  friendly_name: "seeed-sticky-1"


esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # Hold power rails on / 保持电源轨开启
      - output.turn_on: pwr_hold
      - output.turn_on: pwr_lock
      # Turn on touch panel power / 打开触摸供电
      - switch.turn_on: touch_power_enable
      # Read RTC time on boot / 启动读取 RTC 时间
      - pcf8563.read_time:

# ESP32-S3R8 — generic S3 board. Octal PSRAM may need a board that enables it,
# or manual config; adjust if your build does not expose PSRAM.
# ESP32-S3R8 板级配置；八核 PSRAM 可能需要支持 PSRAM 的板子或手动配置。
esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

# Serial logging goes to the physical UART0 (CH343P bridge), not USB_CDC.
# 串口日志走物理 UART0（CH343P 桥接），非 USB_CDC。
logger:
  hardware_uart: UART0

# =============================================================================
# Fonts / 字体
# =============================================================================

font:
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 32
  - file: "gfonts://Inter@700"
    id: font_large
    size: 48

# SPI — shared by ePaper display and SD card
# SPI — 墨水屏与 SD 卡共用（多 CS 设备共用总线）
spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

# I2C sensor bus — SHT4x, PCF8563, BQ27220, LSM6DS3
# I2C 传感器总线 — 温湿度 / RTC / 电量计 / IMU
# GPIO0 is an ESP32-S3 strapping pin; keep this bus passive during boot.
# GPIO0 是 S3 strapping 引脚，启动期间保持该总线被动。
# I2C touch bus — GT911 touch controller
# I2C 触摸总线 — GT911 触摸
i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz

  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

output:
  # Power latch hold — must be HIGH or the device powers off
  # 电源锁存，必须为高，否则断电
  - platform: gpio
    pin: GPIO45
    id: pwr_hold

  # Power lock — must be HIGH after boot
  # 电源锁定，启动后必须为高
  - platform: gpio
    pin: GPIO46
    id: pwr_lock

  # Buzzer PWM output (LEDC) / 蜂鸣器 PWM 输出（LEDC）
  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1000Hz

  # BQ25616 charger enable (GPIO39, active LOW: LOW = charging enabled)
  # 充电使能（GPIO39，低有效：低电平 = 允许充电）
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable

switch:
  # Touch panel power enable / 触摸面板供电使能
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

sensor:
  # SHT40 temperature & humidity (I2C @0x44)
  # SHT40 温湿度传感器（I2C 地址 0x44）
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 60s

  # BQ27220 state-of-charge (I2C @0x55, register 0x2C)
  # BQ27220 电量百分比（I2C 地址 0x55，寄存器 0x2C）
  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8));

  # BQ27220 battery voltage in millivolts (register 0x08)
  # BQ27220 电池电压，单位 mV（寄存器 0x08）
  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x08;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      return static_cast<float>(static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8));

  # BQ27220 signed charge/discharge current in milliamps (register 0x0C)
  # BQ27220 充放电电流，单位 mA（寄存器 0x0C，正数表示充电）
  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x0C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) {
        return NAN;
      }
      uint16_t raw_value = static_cast<uint16_t>(raw[0]) | (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(raw_value));

binary_sensor:
  # UP button (GPIO5) — short beep
  # UP 按键（GPIO5）— 短蜂鸣
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_up
    name: "Button UP"
    on_press:
      then:
        - logger.log: "Button UP pressed"
        - light.turn_on:
            id: buzzer
            brightness: 50%
        - delay: 200ms
        - light.turn_off: buzzer

  # DOWN button (GPIO6) — short beep
  # DOWN 按键（GPIO6）— 短蜂鸣
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    id: button_down
    name: "Button DOWN"
    on_press:
      then:
        - logger.log: "Button DOWN pressed"
        - light.turn_on:
            id: buzzer
            brightness: 50%
        - delay: 200ms
        - light.turn_off: buzzer

  # OK / Power button (GPIO4) — also deep-sleep wake source
  # OK / 电源按键（GPIO4）— 同时作为深度睡眠唤醒源
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button_ok
    name: "Button OK"
    on_press:
      then:
        - logger.log: "Button OK pressed"
        - light.turn_on:
            id: buzzer
            brightness: 50%
        - delay: 200ms
        - light.turn_off: buzzer

  # Charging state inferred from BQ27220 current (>20mA means charging)
  # 充电状态根据 BQ27220 电流判断（大于 20mA 表示充电中）
  - platform: template
    id: charging
    name: "Battery Charging"
    lambda: |-
      if (isnan(id(battery_current).state)) {
        return false;
      }
      return id(battery_current).state > 20.0f;

light:
  # Buzzer wrapped as a "light": brightness = volume
  # 蜂鸣器包装成"灯"实体：亮度 = 音量
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

time:
  # PCF8563 at I2C address 0x51. Read on boot; HA sync writes back.
  # PCF8563（I2C 0x51）。启动读取；HA 同步后回写。
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51
    update_interval: never

  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:

# Home Assistant native API / Home Assistant 原生 API
api:
  encryption:
    key: !secret epd_key

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    password: !secret epd_pass

# Wi-Fi settings / Wi-Fi 设置
wifi:
  ssid: !secret wifi2_ssid
  password: !secret wifi2_password
  ap:
    ssid: "reTerminal-Sticky"
    password: "ChangeMe123"

captive_portal:

# =============================================================================
# [10] GT911 capacitive touch (I2C @0x5D on i2c_touch, 800x480)
# 电容触摸（GT911，I2C 地址 0x5D，挂载 i2c_touch 总线，800×480）
# =============================================================================
touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d"
          args: [touch.x, touch.y]

# -----------------------------------------------------------------------------
# [4] BQ27220 fuel gauge (I2C @0x55 on i2c_sensor)
# BQ27220 电量计（I2C 地址 0x55，挂载 i2c_sensor 总线）
# The sensors above read BQ27220 registers directly with ESPHome's I2C bus API.
# 上面的传感器通过 ESPHome I2C 总线 API 直接读取 BQ27220 寄存器。
# -----------------------------------------------------------------------------


# =============================================================================
# [1] ePaper display (3.97" B/W, 800x480, SSD1677, SPI)
# 墨水屏（3.97 英寸黑白，800×480，SSD1677）
# The "seeed-reterminal-sticky" model preset (ESPHome PR #16950) auto-fills
# cs_pin=GPIO15, dc_pin=GPIO16, reset_pin=GPIO17, busy_pin=GPIO18,
# enable_pin=GPIO47, mirror_x, and 10 MHz data rate. Requires ESPHome dev.
# 模型预设自动填充墨水屏引脚与参数，需 ESPHome dev 版本。
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
    update_interval: 300s
    lambda: |-
      ESP_LOGD("display", "=== ePaper display refresh ===");

      // ---- Title / 标题 ----
      it.printf(400, 15, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER,
                "reTerminal Sticky");
      it.line(20, 55, 780, 55, COLOR_OFF);

      // ---- RTC Time / RTC 时间 ----
      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        it.strftime(400, 65, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER,
                    "%Y-%m-%d  %H:%M", now);
      } else {
        it.printf(400, 65, id(font_medium), COLOR_OFF, TextAlign::TOP_CENTER,
                  "RTC: waiting for sync...");
      }

      // ---- Temperature / 温度 ----
      if (id(temp_sensor).has_state()) {
        it.printf(30, 120, id(font_large), COLOR_OFF, "Temp: %.1f C", id(temp_sensor).state);
      } else {
        it.printf(30, 120, id(font_large), COLOR_OFF, "Temp: -- C");
      }

      // ---- Humidity / 湿度 ----
      if (id(hum_sensor).has_state()) {
        it.printf(30, 185, id(font_large), COLOR_OFF, "Hum:  %.1f %%", id(hum_sensor).state);
      } else {
        it.printf(30, 185, id(font_large), COLOR_OFF, "Hum:  -- %%");
      }

      // ---- Battery / 电池 ----
      if (isnan(id(battery_level).state)) {
        it.printf(30, 260, id(font_medium), COLOR_OFF, "Battery: --%%");
      } else {
        it.printf(30, 260, id(font_medium), COLOR_OFF, "Battery: %.0f%%", id(battery_level).state);
      }

      // ---- Button hints / 按键提示 ----
      it.line(20, 370, 780, 370, COLOR_OFF);
      it.printf(30, 380, id(font_small), COLOR_OFF, "UP/DOWN: beep");
      it.printf(30, 405, id(font_small), COLOR_OFF, "OK (GPIO4): wake");

      // ---- Touch status / 触摸状态 ----
      it.printf(450, 430, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER, "Touch: GT911");

      // ---- Footer / 页脚 ----
      it.printf(400, 458, id(font_small), COLOR_OFF, TextAlign::TOP_CENTER,
                "Selected Sticky hardware features enabled");

