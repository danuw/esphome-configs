# =============================================================================
# reTerminal Sticky — HomeDash-style room controller
# 800x480 monochrome ePaper + GT911 touch + Home Assistant
#
# Default room: Hendon Therapy Hub / garden office
# Edit only the substitutions below to reuse this dashboard in another room.
# =============================================================================

substitutions:
  device_name: seeed-sticky-1
  friendly_name: "Sticky Hub Dashboard"

  room_name: "Hendon Therapy Hub"
  control_1_name: "LIGHTS OUTSIDE"
  control_2_name: "LIGHTS INSIDE"
  control_3_name: "HEATING"

  control_1_entity: "switch.hub_light_switch_l1"
  control_2_entity: "switch.hub_light_switch_l2"
  control_3_entity: "switch.hub_heater_smart_plug"

  # Stored in secrets.yaml so the real SSID is not committed with this file.
  guest_wifi_ssid: !secret guest_wifi_ssid

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      # Sticky switches itself off unless both power latch pins stay high.
      - output.turn_on: pwr_hold
      - output.turn_on: pwr_lock
      - switch.turn_on: touch_power_enable
      - pcf8563.read_time:
      - delay: 3s
      - display.page.show: room_page
      - component.update: epaper_display

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 32MB
  framework:
    type: arduino
    advanced:
      enable_idf_experimental_features: true

logger:
  hardware_uart: UART0

api:
  id: sticky_api
  encryption:
    key: !secret epd_key
  on_client_connected:
    - logger.log: "Home Assistant API client connected"
    - script.execute: refresh_display_delayed
  on_client_disconnected:
    - logger.log: "Home Assistant API client disconnected"
    - script.execute: refresh_display_delayed

ota:
  - platform: esphome
    password: !secret epd_pass

wifi:
  ssid: !secret wifi2_ssid
  password: !secret wifi2_password
  ap:
    ssid: "Sticky Hub Fallback"
    password: !secret sticky_fallback_password
  on_connect:
    - script.execute: refresh_display_delayed

captive_portal:

# =============================================================================
# Fonts and QR code
# =============================================================================

font:
  - file: "gfonts://Inter@700"
    id: font_tiny
    size: 16
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 28
  - file: "gfonts://Inter@700"
    id: font_large
    size: 40

qr_code:
  - id: guest_wifi_qr
    # Example secret value:
    # WIFI:T:WPA;S:My Guest WiFi;P:MyGuestPassword;;
    value: !secret guest_wifi_qr_payload
    ecc: MEDIUM

# =============================================================================
# Sticky hardware buses and power
# =============================================================================

spi:
  clk_pin: GPIO13
  mosi_pin: GPIO14
  miso_pin: GPIO12

i2c:
  - id: i2c_sensor
    scl: GPIO0
    sda: GPIO1
    frequency: 400kHz

  - id: i2c_touch
    scl: GPIO2
    sda: GPIO3
    frequency: 100kHz

output:
  - platform: gpio
    pin: GPIO45
    id: pwr_hold

  - platform: gpio
    pin: GPIO46
    id: pwr_lock

  - platform: ledc
    pin: GPIO48
    id: buzzer_pwm
    frequency: 1000Hz

  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
    id: charge_enable

switch:
  - platform: gpio
    pin: GPIO42
    id: touch_power_enable
    internal: true
    restore_mode: ALWAYS_ON
    setup_priority: 1100

light:
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

# =============================================================================
# Local environment and battery sensors
# =============================================================================

sensor:
  - platform: sht4x
    i2c_id: i2c_sensor
    address: 0x44
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 60s

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x2C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      return static_cast<float>(
        static_cast<uint16_t>(raw[0]) |
        (static_cast<uint16_t>(raw[1]) << 8)
      );

  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "mV"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x08;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      return static_cast<float>(
        static_cast<uint16_t>(raw[0]) |
        (static_cast<uint16_t>(raw[1]) << 8)
      );

  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "mA"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      uint8_t reg = 0x0C;
      uint8_t raw[2] = {0, 0};
      auto err = id(i2c_sensor).write_readv(0x55, &reg, 1, raw, 2);
      if (err != esphome::i2c::ERROR_OK) return NAN;
      uint16_t raw_value = static_cast<uint16_t>(raw[0]) |
                           (static_cast<uint16_t>(raw[1]) << 8);
      return static_cast<float>(static_cast<int16_t>(raw_value));

# =============================================================================
# RTC and reusable interaction scripts
# =============================================================================

time:
  - platform: pcf8563
    i2c_id: i2c_sensor
    id: rtc_time
    address: 0x51
    update_interval: never

  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:
        - script.execute: refresh_display_delayed

script:
  # Immediate confirmation while the ePaper screen is refreshing.
  - id: touch_feedback
    mode: restart
    then:
      - light.turn_on:
          id: buzzer
          brightness: 35%
      - delay: 70ms
      - light.turn_off: buzzer

  # Coalesce Wi-Fi, API and Home Assistant state changes into one refresh.
  - id: refresh_display_delayed
    mode: restart
    then:
      - delay: 1500ms
      - component.update: epaper_display

  - id: action_success_feedback
    mode: restart
    then:
      - logger.log: "Home Assistant action succeeded"
      - light.turn_on:
          id: buzzer
          brightness: 25%
      - delay: 60ms
      - light.turn_off: buzzer
      # Allow the imported HA entity state to arrive before redrawing e-paper.
      - delay: 600ms
      - script.execute: refresh_display_delayed

  - id: action_error_feedback
    mode: restart
    then:
      - logger.log:
          level: ERROR
          format: "Home Assistant action failed or API is unavailable"
      - light.turn_on:
          id: buzzer
          brightness: 65%
      - delay: 250ms
      - light.turn_off: buzzer
      - delay: 120ms
      - light.turn_on:
          id: buzzer
          brightness: 65%
      - delay: 250ms
      - light.turn_off: buzzer

  - id: toggle_control_1
    then:
      - script.execute: touch_feedback
      - if:
          condition:
            api.connected:
          then:
            - logger.log: "Requesting switch.toggle for ${control_1_entity}"
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: "${control_1_entity}"
                on_success:
                  - script.execute: action_success_feedback
                on_error:
                  - script.execute: action_error_feedback
          else:
            - script.execute: action_error_feedback

  - id: toggle_control_2
    then:
      - script.execute: touch_feedback
      - if:
          condition:
            api.connected:
          then:
            - logger.log: "Requesting switch.toggle for ${control_2_entity}"
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: "${control_2_entity}"
                on_success:
                  - script.execute: action_success_feedback
                on_error:
                  - script.execute: action_error_feedback
          else:
            - script.execute: action_error_feedback

  - id: toggle_control_3
    then:
      - script.execute: touch_feedback
      - if:
          condition:
            api.connected:
          then:
            - logger.log: "Requesting switch.toggle for ${control_3_entity}"
            - homeassistant.action:
                action: switch.toggle
                data:
                  entity_id: "${control_3_entity}"
                on_success:
                  - script.execute: action_success_feedback
                on_error:
                  - script.execute: action_error_feedback
          else:
            - script.execute: action_error_feedback

  - id: room_all_off
    then:
      - script.execute: touch_feedback
      - if:
          condition:
            api.connected:
          then:
            - logger.log: "Requesting room all off"
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: "${control_1_entity}"
                on_error:
                  - script.execute: action_error_feedback
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: "${control_2_entity}"
                on_error:
                  - script.execute: action_error_feedback
            - homeassistant.action:
                action: switch.turn_off
                data:
                  entity_id: "${control_3_entity}"
                on_success:
                  - script.execute: action_success_feedback
                on_error:
                  - script.execute: action_error_feedback
          else:
            - script.execute: action_error_feedback

# =============================================================================
# Diagnostic test button
# Use this once from Home Assistant to separate API/action issues from touch issues.
# =============================================================================

button:
  - platform: template
    name: "Test dashboard Light 1 toggle"
    id: test_dashboard_light_1
    entity_category: diagnostic
    on_press:
      then:
        - script.execute: toggle_control_1

# =============================================================================
# Touch controller
# =============================================================================

touchscreen:
  - platform: gt911
    i2c_id: i2c_touch
    id: sticky_touch
    display: epaper_display
    interrupt_pin: GPIO21
    reset_pin: GPIO41
    on_touch:
      - logger.log:
          format: "Touch x=%d y=%d"
          args: [touch.x, touch.y]

# =============================================================================
# Buttons, Home Assistant states and touchscreen hit areas
# =============================================================================

binary_sensor:
  # Physical buttons: UP=Room, DOWN=Guest Wi-Fi, OK=Home/refresh.
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    id: button_up
    name: "Button UP"
    on_press:
      then:
        - script.execute: touch_feedback
        - display.page.show: room_page
        - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    id: button_down
    name: "Button DOWN"
    on_press:
      then:
        - script.execute: touch_feedback
        - display.page.show: guest_wifi_page
        - component.update: epaper_display

  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    id: button_ok
    name: "Button OK"
    on_press:
      then:
        - script.execute: touch_feedback
        - display.page.show: room_page
        - component.update: epaper_display

  - platform: template
    id: charging
    name: "Battery Charging"
    lambda: |-
      if (isnan(id(battery_current).state)) return false;
      return id(battery_current).state > 20.0f;

  # Imported HA states make the tiles show their actual current state.
  - platform: homeassistant
    id: control_1_state
    entity_id: ${control_1_entity}
    internal: true
    on_state:
      then:
        - script.execute: refresh_display_delayed

  - platform: homeassistant
    id: control_2_state
    entity_id: ${control_2_entity}
    internal: true
    on_state:
      then:
        - script.execute: refresh_display_delayed

  - platform: homeassistant
    id: control_3_state
    entity_id: ${control_3_entity}
    internal: true
    on_state:
      then:
        - script.execute: refresh_display_delayed

  # Room page: four generous touch targets.
  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_control_1
    internal: true
    page_id: room_page
    x_min: 20
    x_max: 390
    y_min: 88
    y_max: 220
    on_press:
      then:
        - script.execute: toggle_control_1

  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_control_2
    internal: true
    page_id: room_page
    x_min: 410
    x_max: 780
    y_min: 88
    y_max: 220
    on_press:
      then:
        - script.execute: toggle_control_2

  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_control_3
    internal: true
    page_id: room_page
    x_min: 20
    x_max: 390
    y_min: 235
    y_max: 367
    on_press:
      then:
        - script.execute: toggle_control_3

  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_all_off
    internal: true
    page_id: room_page
    x_min: 410
    x_max: 780
    y_min: 235
    y_max: 367
    on_press:
      then:
        - script.execute: room_all_off

  # Bottom navigation tabs.
  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_room_tab
    internal: true
    page_id: guest_wifi_page
    x_min: 0
    x_max: 399
    y_min: 400
    y_max: 479
    on_press:
      then:
        - script.execute: touch_feedback
        - display.page.show: room_page
        - component.update: epaper_display

  - platform: touchscreen
    touchscreen_id: sticky_touch
    id: touch_wifi_tab
    internal: true
    page_id: room_page
    x_min: 400
    x_max: 799
    y_min: 400
    y_max: 479
    on_press:
      then:
        - script.execute: touch_feedback
        - display.page.show: guest_wifi_page
        - component.update: epaper_display

# =============================================================================
# 800x480 ePaper dashboard
# =============================================================================

display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
    update_interval: 5min
    pages:
      - id: room_page
        lambda: |-
          it.fill(Color::WHITE);

          // ---------- Shared header ----------
          it.printf(20, 10, id(font_medium), Color::BLACK,
                    TextAlign::TOP_LEFT, "${room_name}");

          auto now = id(rtc_time).now();
          if (now.is_valid()) {
            it.strftime(780, 13, id(font_small), Color::BLACK,
                        TextAlign::TOP_RIGHT, "%H:%M", now);
          } else {
            it.print(780, 13, id(font_small), Color::BLACK,
                     TextAlign::TOP_RIGHT, "--:--");
          }

          if (id(temp_sensor).has_state() && id(hum_sensor).has_state()) {
            it.printf(20, 52, id(font_small), Color::BLACK,
                      "%.1f C   %.0f%% RH",
                      id(temp_sensor).state, id(hum_sensor).state);
          } else {
            it.print(20, 52, id(font_small), Color::BLACK,
                     "Temperature --   Humidity --");
          }

          if (!isnan(id(battery_level).state)) {
            it.printf(780, 52, id(font_small), Color::BLACK,
                      TextAlign::TOP_RIGHT, "BAT %.0f%%  HA %s",
                      id(battery_level).state,
                      id(sticky_api).is_connected() ? "OK" : "OFF");
          } else {
            it.printf(780, 52, id(font_small), Color::BLACK,
                      TextAlign::TOP_RIGHT, "HA %s",
                      id(sticky_api).is_connected() ? "OK" : "OFF");
          }

          it.line(20, 78, 780, 78, Color::BLACK);

          // ---------- Reusable monochrome control tile ----------
          auto draw_tile = [&](int x, int y, int w, int h,
                               const char *label, bool active,
                               const char *inactive_text,
                               const char *active_text) {
            if (active) {
              it.filled_rectangle(x, y, w, h, Color::BLACK);
              it.printf(x + w / 2, y + 24, id(font_medium), Color::WHITE,
                        TextAlign::TOP_CENTER, "%s", label);
              it.printf(x + w / 2, y + 76, id(font_large), Color::WHITE,
                        TextAlign::TOP_CENTER, "%s", active_text);
            } else {
              it.rectangle(x, y, w, h, Color::BLACK);
              it.printf(x + w / 2, y + 24, id(font_medium), Color::BLACK,
                        TextAlign::TOP_CENTER, "%s", label);
              it.printf(x + w / 2, y + 76, id(font_large), Color::BLACK,
                        TextAlign::TOP_CENTER, "%s", inactive_text);
            }
          };

          draw_tile(20, 88, 370, 132, "${control_1_name}",
                    id(control_1_state).state, "OFF", "ON");
          draw_tile(410, 88, 370, 132, "${control_2_name}",
                    id(control_2_state).state, "OFF", "ON");
          draw_tile(20, 235, 370, 132, "${control_3_name}",
                    id(control_3_state).state, "OFF", "ON");

          // ALL OFF is an action rather than a stateful tile.
          it.rectangle(410, 235, 370, 132, Color::BLACK);
          it.rectangle(415, 240, 360, 122, Color::BLACK);
          it.print(595, 258, id(font_medium), Color::BLACK,
                   TextAlign::TOP_CENTER, "ROOM");
          it.print(595, 304, id(font_large), Color::BLACK,
                   TextAlign::TOP_CENTER, "ALL OFF");

          // ---------- Bottom navigation ----------
          it.filled_rectangle(0, 400, 400, 80, Color::BLACK);
          it.print(200, 423, id(font_medium), Color::WHITE,
                   TextAlign::TOP_CENTER, "ROOM");
          it.rectangle(400, 400, 400, 80, Color::BLACK);
          it.print(600, 423, id(font_medium), Color::BLACK,
                   TextAlign::TOP_CENTER, "GUEST WI-FI");

      - id: guest_wifi_page
        lambda: |-
          it.fill(Color::WHITE);

          it.print(20, 12, id(font_medium), Color::BLACK,
                   TextAlign::TOP_LEFT, "Guest Wi-Fi");
          it.print(780, 16, id(font_small), Color::BLACK,
                   TextAlign::TOP_RIGHT, "Scan to join");
          it.line(20, 62, 780, 62, Color::BLACK);

          // Keep the QR code comfortably inside a 270x270 area.
          int modules = id(guest_wifi_qr).get_size();
          int scale = 270 / modules;
          if (scale < 2) scale = 2;
          int qr_size = modules * scale;
          int qr_x = 45 + ((290 - qr_size) / 2);
          int qr_y = 87 + ((285 - qr_size) / 2);
          it.qr_code(qr_x, qr_y, id(guest_wifi_qr), Color::BLACK, scale);

          it.print(380, 100, id(font_small), Color::BLACK,
                   "NETWORK");
          it.printf(380, 132, id(font_medium), Color::BLACK,
                    "%s", "${guest_wifi_ssid}");
          it.line(380, 180, 755, 180, Color::BLACK);

          it.print(380, 210, id(font_medium), Color::BLACK,
                   "1. Open your camera");
          it.print(380, 258, id(font_medium), Color::BLACK,
                   "2. Scan the code");
          it.print(380, 306, id(font_medium), Color::BLACK,
                   "3. Tap Join");
          it.print(380, 354, id(font_tiny), Color::BLACK,
                   "No app or manual password needed");

          // ---------- Bottom navigation ----------
          it.rectangle(0, 400, 400, 80, Color::BLACK);
          it.print(200, 423, id(font_medium), Color::BLACK,
                   TextAlign::TOP_CENTER, "ROOM");
          it.filled_rectangle(400, 400, 400, 80, Color::BLACK);
          it.print(600, 423, id(font_medium), Color::WHITE,
                   TextAlign::TOP_CENTER, "GUEST WI-FI");
